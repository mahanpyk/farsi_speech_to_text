name: farsi_speech_to_text
description: Offline Persian speech recognition for Flutter using the Nemotron Farsi model, with support for WAV files and live PCM audio.
version: 0.1.0
repository: https://github.com/mahanpyk/farsi_speech_to_text
issue_tracker: https://github.com/mahanpyk/farsi_speech_to_text/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

topics:
  - speech-to-text
  - persian
  - speech-recognition
  - offline
  - flutter

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  crypto: ^3.0.7
  path: ^1.9.1
  sherpa_onnx: '>=2.0.1 <2.1.0'
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - path: assets/farsi_worker.js
      platforms: [web]
