name: farsi_speech_to_text_example
description: A Flutter demo for Persian speech recognition from the microphone and WAV files.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  farsi_speech_to_text:
    path: ..
  file_selector: ^1.0.3
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
